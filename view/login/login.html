<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanboard | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 100%);
        }

        .form-signin {
            max-width: 380px;
            width: 100%;
            padding: 30px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }
    </style>
</head>
<body>
    <main class="form-signin">
        <form action="{% url 'entrar' %}" method="post">
            {% csrf_token %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <input type="hidden" name="next" value="{{ next }}">
            <h1 class="h3 mb-3 fw-normal text-center">Faça login</h1>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" name="email" placeholder="name@example.com" autocomplete="email" required>
                <label for="floatingInput">Endereço de email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" name="senha" placeholder="Senha" autocomplete="current-password" required>
                <label for="floatingPassword">Senha</label>
            </div>

            <div class="form-check text-start mb-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Lembre-me</label>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>
            <p class="text-center mt-4 mb-0">Não tem uma conta? <a href="./registro.html">Registre-se</a></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
