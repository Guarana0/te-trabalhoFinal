<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center py-4 bg-body-tertiary min-vh-100">

    <main class="form-signin w-100 m-auto" style="max-width: 400px; padding: 15px;">
        <form>
            <h1 class="h3 mb-3 fw-normal text-center">Faça o seu registro</h1>
            
            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="floatingNome" placeholder="João">
                <label for="floatingNome">Nome</label>
            </div>

            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="floatingSobrenome" placeholder="Silva">
                <label for="floatingSobrenome">Sobrenome</label>
            </div>
            
            <div class="form-floating mb-2">
                <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com">
                <label for="floatingEmail">Endereço de Email</label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Senha</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" 
                class="form-control" id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Confirmar Senha</label>
            </div>
            
            <div class="form-check text-start my-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                <label class="form-check-label" for="checkDefault">Lembre-me</label>
            </div>
            
            <button class="btn btn-primary w-100 py-2" type="submit">Cadastrar-se</button>
            <p class="p-3 py-4">Já tem uma conta? <a href="./login.html">Faça seu Login</a></p> 
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
